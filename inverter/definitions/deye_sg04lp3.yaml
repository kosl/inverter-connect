# Deye 12K EU tree Phase Hybrid
# SUN-12K-SG04LP3 | 12KW | Three Phase | 2 MPPT | Hybrid Inverter | Low Voltage Battery
# Modbus information retrieved from:Deye Modbus RTU tree Phase Energy Storage Communications Protokoll
requests:
  - start: 0x0003
    end: 0x0059
    mb_functioncode: 0x03
  - start: 0x0063
    end: 0x006D
    mb_functioncode: 0x03
  - start: 0x0085
    end: 0x0085
    mb_functioncode: 0x03
  - start: 0x0202
    end: 0x022E
    mb_functioncode: 0x03
  - start: 0x0218
    end: 0x021A
    mb_functioncode: 0x03
  - start: 0x024A
    end: 0x024F
    mb_functioncode: 0x03
  - start: 0x0256
    end: 0x027C
    mb_functioncode: 0x03
  - start: 0x0284
    end: 0x028D
    mb_functioncode: 0x03
  - start: 0x0295
    end: 0x029F
    mb_functioncode: 0x03
  - start: 0x02A0
    end: 0x02A7
    mb_functioncode: 0x03

parameters:
  - group: solar
    items:
      - name: "PV1 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x02A0]

      - name: "PV2 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x02A1]

      - name: "PV1 Voltage"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x02A4]

      - name: "PV2 Voltage"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x02A6]

      - name: "PV1 Current"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x02A5]

      - name: "PV2 Current"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x02A7]

      - name: "Daily Production"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0211]
        validation:
          max: 100
          invalidate_all:

      - name: "Total Production"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0216, 0x0217]

  - group: Battery
    items:
      - name: "Battery Equalization V"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0063]

      - name: "Battery Absorption V"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0064]

      - name: "Battery Float V"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0065]

      - name: "Battery Capacity"
        device_class: "battery"
        state_class: "measurement"
        uom: "Ah"
        scale: 1
        rule: 1
        registers: [0x0066]

      - name: "Battery Empty V"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0066]

      - name: "Battery Max A Charge"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 1
        rule: 1
        registers: [0x006C]

      - name: "Battery Max A Discharge"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 1
        rule: 1
        registers: [0x006D]

      - name: "Daily Battery Charge"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0202]

      - name: "Daily Battery Discharge"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0203]

      - name: "Total Battery Charge"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0204, 0x0205]

      - name: "Total Battery Discharge"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0206, 0x0207]

      - name: "Battery Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x024E]

      - name: "Battery Voltage"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x024B]

      - name: "Battery SOC"
        device_class: "battery"
        state_class: "measurement"
        uom: "%"
        scale: 1
        rule: 1
        registers: [0x024C]
        validation:
          min: 0
          max: 101

      - name: "Battery Current"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x024F]

      - name: "Battery Temperature"
        device_class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 1
        offset: 1000
        registers: [0x024A]
        validation:
          min: 1
          max: 99

  - group: Grid
    items:
      - name: "Grid Frequency"
        device_class: "frequency"
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x0261]

      - name: "Total Grid Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0271]

      - name: "Grid Voltage L1"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0256]

      - name: "Grid Voltage L2"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0257]

      - name: "Grid Voltage L3"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0258]

      - name: "Internal CT L1 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x025C]

      - name: "Internal CT L2 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x025D]

      - name: "Internal CT L3 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x025E]

      - name: "External CT L1 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0268]

      - name: "External CT L2 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0269]

      - name: "External CT L3 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x026A]

      - name: "Daily Energy Bought"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0208]

      - name: "Total Energy Bought"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x020A, 0x020B]

      - name: "Daily Energy Sold"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0209]

      - name: "Total Energy Sold"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x020C,0x020D]

  - group: Upload
    items:
      - name: "Total Load Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x028D]

      - name: "Load L1 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x028A]

      - name: "Load L2 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x028B]

      - name: "Load L3 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x028C]

      - name: "Load Voltage L1"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0284]

      - name: "Load Voltage L2"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0285]

      - name: "Load Voltage L3"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0286]

      - name: "Daily Load Consumption"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x020E]

      - name: "Total Load Consumption"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x020F, 0x0210]

  - group: Inverter
    items:
      - name: "Running Status"
        device_class: "enum"
        uom: ""
        scale: 1
        rule: 1
        registers: [0x01F4]
        isstr: true
        lookup:
        -  key: 0
           value: "Stand-by"
        -  key: 1
           value: "Self-checking"
        -  key: 2
           value: "Normal"
        -  key: 3
           value: "FAULT"

      - name: "Total Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x00AF]

      - name: "Current L1"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x0276]

      - name: "Current L2"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x0277]

      - name: "Current L3"
        device_class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x0278]

      - name: "Inverter L1 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0279]

      - name: "Inverter L2 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x027A]

      - name: "Inverter L3 Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x027B]

      - name: "DC Temperature"
        device_class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x021C]

      - name: "AC Temperature"
        device_class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x021D]

      - name: "Rated Power"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 0.1
        rule: 3
        registers: [0x0014,0x0015]

      - name: "Inverter ID"
        uom: ""
        scale: 1
        rule: 5
        registers: [0x0003, 0x0004, 0x0005, 0x0006, 0x0007]
        isstr: true

      - name: "Communication Board Version No."
        uom: ""
        scale: 1
        rule: 1
        registers: [0x0011]
        isstr: true

      - name: "Control Board Version No."
        uom: ""
        scale: 1
        rule: 1
        registers: [0x000D]
        isstr: true

  - group: SmartLoad
    items:
      - name: "SmartLoad Enable Status"
        device_class: "enum"
        state_class: "measurement"
        uom: ""
        scale: 1
        rule: 1
        registers: [0x0085]
        isstr: true
        lookup:
          - key: 0
            value: "GEN Use"
          - key: 1
            value: "SMART Load output"
          - key: 2
            value: "Microinverter"
        
      - name: "Phase voltage of Gen port A"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0295]

      - name: "Phase voltage of Gen port B"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0296]

      - name: "Phase voltage of Gen port C"
        device_class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0297]

      - name: "Phase power of Gen port A"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x0298]
        validation:
          min: 0
          max: 12000

      - name: "Phase power of Gen port B"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x0299]
        validation:
          min: 0
          max: 12000

      - name: "Phase power of Gen port C"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x029A]
        validation:
          min: 0
          max: 12000

      - name: "Total Power of Gen port"
        device_class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x029B]
        validation:
          min: 0
          max: 12000

      - name: "Generator daily power generation"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0218]

      - name: "Generator total power generation"
        device_class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0219, 0x021A]

        
        
  - group: Alert
    items:
      - name: "Alert"
        uom: ""
        scale: 1
        rule: 5
        registers: [0x0229, 0x022A, 0x22B, 0x022C, 0x022D, 0x022E]
