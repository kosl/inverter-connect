#
# Borrowed form https://github.com/StephanJoubert/home_assistant_solarman/
#
# First version : 22.2.2023
# Microinverter SUN600G3 (DEYE/VESDAS)
# 2x MPPT, 2x inverter
# 1x Logger, 2x Module,

requests:
  - start: 0x0003
    end:  0x0080
    mb_functioncode: 0x03

parameters:
  - group: solar
    items:
    - name: "PV1 Voltage"
      device_class: "voltage"
      state_class: "measurement"
      unit_of_measurement: "V"
      scale: 0.1
      rule: 1
      registers: [0x006D]

    - name: "PV2 Voltage"
      device_class: "voltage"
      state_class: "measurement"
      unit_of_measurement: "V"
      scale: 0.1
      rule: 1
      registers: [0x006F]

    - name: "PV1 Current"
      device_class: "current"
      state_class: "measurement"
      unit_of_measurement: "A"
      scale: 0.1
      rule: 1
      registers: [0x006E]

    - name: "PV2 Current"
      device_class: "current"
      state_class: "measurement"
      unit_of_measurement: "A"
      scale: 0.1
      rule: 1
      registers: [0x0070]

    - name: "Daily Production"
      device_class: "energy"
      state_class: "total"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 1
      registers: [0x003C]

    - name: "Daily Production 1"
      device_class: "energy"
      state_class: "total"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 1
      registers: [0x0041]

    - name: "Daily Production 2"
      device_class: "energy"
      state_class: "total"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 1
      registers: [0x0042]

    - name: "Total Production"
      device_class: "energy"
      state_class: "total_increasing"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 3
      registers: [0x003F,0x0040]
      validation:
        min: 0.1

    - name: "Total Production 1"
      device_class: "energy"
      state_class: "total_increasing"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 3
      registers: [0x0045]

    - name: "Total Production 2"
      device_class: "energy"
      state_class: "total_increasing"
      unit_of_measurement: "kWh"
      scale: 0.1
      rule: 3
      registers: [0x0047]

    - name: "Active Power Regulations"
      unit_of_measurement: "%"
      scale: 1
      rule: 1
      registers: [0x0028]

  - group: Grid
    items:
    - name: "AC Voltage"
      device_class: "voltage"
      state_class: "measurement"
      unit_of_measurement: "V"
      scale: 0.1
      rule: 1
      registers: [0x0049]

    - name: "Grid Current"
      device_class: "current"
      state_class: "measurement"
      unit_of_measurement: "A"
      scale: 0.1
      rule: 2
      registers: [0x004C]

    - name: "AC Output Frequency"
      device_class: "frequency"
      state_class: "measurement"
      unit_of_measurement: "Hz"
      scale: 0.01
      rule: 1
      registers: [0x004F]

    - name: "Grid Voltage Upp Limit"
      device_class: "voltage"
      unit_of_measurement: "V"
      scale: 0.1
      rule: 1
      registers: [0x001B]

    - name: "Grid Voltage Lower Limit"
      device_class: "voltage"
      unit_of_measurement: "V"
      scale: 0.1
      rule: 1
      registers: [0x001C]

    - name: "Grid Frequency Upper Limit"
      device_class: "frequency"
      unit_of_measurement: "Hz"
      scale: 0.01
      rule: 1
      registers: [0x001D]

    - name: "Grid Frequency Lower Limit"
      device_class: "frequency"
      unit_of_measurement: "Hz"
      scale: 0.01
      rule: 1
      registers: [0x001E]

    - name: "Overfrequency And Load Reduction Starting Point"
      device_class: "frequency"
      unit_of_measurement: "Hz"
      scale: 0.01
      rule: 1
      registers: [0x0022]

    - name: "Overfrequency And Load Reduction Percentage"
      unit_of_measurement: "%"
      scale: 1
      rule: 1
      registers: [0x0023]

    - name: "ON-OFF Enable"
      device_class: "enum"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x002B]
      isstr: true
      lookup:
      - key: 0
        value: "OFF"
      - key: 1
        value: "ON"

    - name: "Island Protection Enable"
      device_class: "enum"
      state_class: "measurement"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x002E]
      isstr: true
      lookup:
      - key: 0
        value: "Disabled"
      - key: 1
        value: "Enabled"

    - name: "Overfrequency&Load-shedding Enable"
      device_class: "enum"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x0031]
      isstr: true
      lookup:
      - key: 0
        value: "Disabled"
      - key: 1
        value: "Enabled"

  - group: Inverter
    items:
    - name: "Running Status"
      device_class: "enum"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x003B]
      isstr: true
      lookup:
      - key: 0
        value: "Stand-by"
      - key: 1
        value: "Self-check"
      - key: 2
        value: "Normal"
      - key: 3
        value: "Warning"
      - key: 4
        value: "Fault"

    - name: "Total AC Output Power (Active)"
      device_class: "power"
      state_class: "measurement"
      unit_of_measurement: "W"
      scale: 0.1
      rule: 3
      registers: [0x0056, 0x0057]

    - name: "Radiator Temperature"
      device_class: "temperature"
      unit_of_measurement: "°C"
      state_class: "measurement"
      scale: 0.01
      rule: 1
      offset: 1000
      registers: [0x005a]

    - name: "Inverter ID"
      unit_of_measurement: ""
      scale: 1
      rule: 5
      registers: [0x0003,0x0004,0x0005,0x0006,0x0007]
      isstr: true

    - name: "Hardware Version"
      unit_of_measurement: ""
      scale: 1
      rule: 7
      registers: [0x000C]
      isstr: true

    - name: "DC Master Firmware Version"
      unit_of_measurement: ""
      scale: 1
      rule: 7
      registers: [0x000D]
      isstr: true

    - name: "AC Version. Number"
      unit_of_measurement: ""
      scale: 1
      rule: 7
      registers: [0x000E]
      isstr: true

    - name: "Rated Power"
      device_class: "energy"
      unit_of_measurement: "W"
      scale: 0.1
      rule: 1
      registers: [0x0010]

    - name: "Communication Protocol Version"
      unit_of_measurement: ""
      scale: 1
      rule: 7
      registers: [0x0012]
      isstr: true

    - name: "Start-up Self-checking Time "
      unit_of_measurement: "s"
      scale: 1
      rule: 1
      registers: [0x0015]

    - name: "Update Time"
      unit_of_measurement: ""
      scale: 1
      rule: 8
      registers: [0x0016,0x0017,0x0018]
      isstr: true

    - name: "Soft Start Enable"
      device_class: "enum"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x002F]
      isstr: true
      lookup:
      - key: 0
        value: "Disabled"
      - key: 1
        value: "Enabled"

    - name: "Power Factor Regulation"
      unit_of_measurement: ""
      scale: 0.1
      rule: 2
      registers: [0x0032]

    - name: "Restore Factory Settings"
      device_class: "enum"
      unit_of_measurement: ""
      scale: 1
      rule: 1
      registers: [0x0036]
      isstr: true
      lookup:
      - key: 0
        value: "Disabled"
      - key: 1
        value: "Enabled"
